name: F0 targeted DEUP plan readback
on:
  push:
    branches: [main]
    paths: ['.github/workflows/f0-deup-target.yml']
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --disable-pip-version-check --target "$RUNNER_TEMP/f0target" pymupdf
      - run: |
          PYTHONPATH="$RUNNER_TEMP/f0target" python - <<'PY'
          import pathlib,urllib.request,hashlib,json,base64
          import fitz
          d=pathlib.Path('custody/f0-deup-target');d.mkdir(exist_ok=True,parents=True)
          u='https://www.portdebarcelona.cat/sites/default/files/content/file/2021/10/24/1/delimitacion-de-los-espacios-y-usos-portuarios-deup_1.pdf'
          out={'url':u}
          try:
              with urllib.request.urlopen(u,timeout=40) as f:b=f.read(40000001)
              out.update({'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest()})
              assert out['sha256']=='2fa06be75e20eba812dca128508972082e1d40b4b213c33d34dfdd5b68bcb721'
              with fitz.open(stream=b,filetype='pdf') as doc:
                  out['pages']=len(doc);out['renders']=[]
                  for n in [70,74]:
                      page=doc[n-1];r=page.rect
                      for name,clip,scale in [('full',r,1600/r.width),('table',fitz.Rect(r.x0+.80*r.width,r.y0+.42*r.height,r.x1,r.y0+.94*r.height),3),('title',fitz.Rect(r.x0+.68*r.width,r.y0+.93*r.height,r.x1,r.y1),3)]:
                          pix=page.get_pixmap(matrix=fitz.Matrix(scale,scale),clip=clip,alpha=False)
                          if name=='full':blob=pix.tobytes('jpeg',jpg_quality=80);ext='jpg'
                          else:blob=pix.tobytes('png');ext='png'
                          f=f'p{n}_{name}.{ext}.b64';(d/f).write_text(base64.b64encode(blob).decode())
                          out['renders'].append({'page':n,'type':name,'path':f,'sha256':hashlib.sha256(blob).hexdigest(),'bytes':len(blob),'clip':list(clip)})
              out['status']='RENDERED'
          except Exception as e:out['status']='FAILED';out['error']=repr(e)
          (d/'report.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          PY
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add custody/f0-deup-target/
          git commit -m 'F0 target plan pages 70 and 74'
          git push origin HEAD:main

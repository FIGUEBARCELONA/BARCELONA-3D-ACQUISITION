name: F0 lot45 CartoBCN public distribution discovery
on:
  push:
    branches: [audit/f0-lot06-20261125]
    paths: ['.github/workflows/f0-lot45.yml']
concurrency:
  group: f0-canonical-custody
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/f0-lot06-20261125
          fetch-depth: 0
      - name: Discover official dataset links
        shell: python
        run: |
          import urllib.request,urllib.error,urllib.parse,xml.etree.ElementTree as ET,hashlib,json,datetime,pathlib,concurrent.futures
          from html.parser import HTMLParser
          out=pathlib.Path('custody/f0-lot45-20261125');out.mkdir(parents=True,exist_ok=True)
          tasks=[('dataset131','https://w20.bcn.cat/cartobcn/atom.ashx?file=131'),('descriptor','https://w20.bcn.cat/cartobcn/opensearch.ashx'),('portal131','https://portaldades.ajuntament.barcelona.cat/mapes/131'),('cartobcn131','https://w20.bcn.cat/CartoBCN/?prod=131')]
          class Links(HTMLParser):
              def __init__(self):super().__init__();self.links=[]
              def handle_starttag(self,tag,attrs):
                  d=dict(attrs)
                  if tag in ('a','link','script') and (d.get('href') or d.get('src')):self.links.append({'tag':tag,'url':d.get('href') or d.get('src'),'rel':d.get('rel'),'type':d.get('type')})
          def check(task):
              name,url=task;r={'name':name,'url':url,'status':'BLOCKED'}
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'GTA-BCN-public-data-audit/1.0','Accept':'*/*'})
                  with urllib.request.urlopen(req,timeout=20) as x:
                      r.update(http=x.status,effective_url=x.geturl(),content_type=x.headers.get('Content-Type'))
                      b=x.read(3000001)
                  if len(b)>3000000:raise ValueError('bounded metadata limit')
                  r.update(bytes=len(b),sha256=hashlib.sha256(b).hexdigest())
                  if name in ('dataset131','descriptor'):
                      root=ET.fromstring(b)
                      r['root']=root.tag
                      r['links']=[dict(el.attrib) for el in root.iter() if el.tag.split('}')[-1] in ('link','Url')]
                      r['titles']=[el.text for el in root.iter() if el.tag.split('}')[-1]=='title']
                  else:
                      p=Links();p.feed(b.decode('utf-8','replace'))
                      r['links']=[{**v,'url':urllib.parse.urljoin(url,v['url'])} for v in p.links if not v['url'].startswith(('#','javascript:'))][:200]
                  r['status']='METADATA_INSPECTED'
              except urllib.error.HTTPError as e:r.update(http=e.code,error=str(e))
              except Exception as e:r['error']=repr(e)
              return r
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as ex:results=list(ex.map(check,tasks))
          s=json.dumps({'utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'results':results,'qualification':'Public metadata only; no large file acquisition or private data.'},indent=2,ensure_ascii=False)+'\n'
          (out/'report.json').write_text(s);print(s)
      - name: Preserve audit report without force
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add custody/f0-lot45-20261125/report.json
          git commit -m 'Preserve lot45 public CartoBCN distribution diagnostics'
          for attempt in 1 2 3; do
            git fetch origin audit/f0-lot06-20261125
            git rebase FETCH_HEAD || { git rebase --abort; exit 1; }
            if git push origin HEAD:audit/f0-lot06-20261125; then exit 0; fi
          done
          exit 1

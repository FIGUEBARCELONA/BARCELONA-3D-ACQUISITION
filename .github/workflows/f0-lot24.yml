name: F0 lot24 numerical point query and WCS metadata
on:
  push:
    branches: [audit/f0-lot06-20261125]
    paths: ['.github/workflows/f0-lot24.yml']
concurrency:
  group: f0-canonical-custody
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/f0-lot06-20261125
          fetch-depth: 0
      - name: Parallel read-only source queries
        shell: python
        run: |
          import pathlib,json,datetime,urllib.request,urllib.parse,hashlib,concurrent.futures,xml.etree.ElementTree as ET
          out=pathlib.Path('custody/f0-lot24-20261125');out.mkdir(parents=True,exist_ok=True)
          wms='https://geoserveis.icgc.cat/servei/catalunya/elevacions-territorial/wms'
          wcs='https://geoserveis.icgc.cat/icc_mdt/wcs/service'
          layers={'MDTe':'model-elevacions-terreny-edificis-catalunya-lidar-1m-2021-2023','MDTev':'model-elevacions-terreny-edificis-vegetacio-catalunya-lidar-1m-2021-2023','nDSM':'model-alcaries-catalunya-lidar-1m-2021-2023','CHM':'model-alcaries-vegetacio-catalunya-lidar-1m-2021-2023'}
          def get(u,p):
              url=u+'?'+urllib.parse.urlencode(p)
              with urllib.request.urlopen(url,timeout=25) as x:
                  b=x.read(2000001)
                  if len(b)>2000000:raise ValueError('size bound')
                  return b,{'url':url,'http':x.status,'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest(),'content_type':x.headers.get('Content-Type')}
          def describe():
              r=[]
              for op in ('GetCapabilities','DescribeCoverage'):
                  a={'operation':op,'status':'BLOCKED'}
                  try:
                      p={'SERVICE':'WCS','VERSION':'1.0.0','REQUEST':op}
                      if op=='DescribeCoverage':p['COVERAGE']='icc:met'
                      b,m=get(wcs,p);a.update(m)
                      z=ET.fromstring(b);a.update(root=z.tag,excerpt=b.decode(errors='replace')[:20000],status='XML_INSPECTED')
                      (out/(op+'.xml')).write_bytes(b)
                  except Exception as e:a['error']=repr(e)
                  r.append(a)
              return r
          def point(item):
              k,l=item;r={'product':k,'status':'BLOCKED','layer':l}
              try:
                  p={'SERVICE':'WMS','VERSION':'1.3.0','REQUEST':'GetFeatureInfo','LAYERS':l,'QUERY_LAYERS':l,'CRS':'EPSG:25831','BBOX':'430449.5,4582324.5,430480.5,4582355.5','WIDTH':31,'HEIGHT':31,'I':15,'J':15,'STYLES':'','FORMAT':'image/png','INFO_FORMAT':'text/plain','FEATURE_COUNT':1}
                  b,m=get(wms,p);r.update(m,body=b.decode(errors='replace')[:10000],status='RESPONSE_INSPECTED')
                  (out/(k+'.txt')).write_bytes(b)
              except Exception as e:r['error']=repr(e)
              return r
          with concurrent.futures.ThreadPoolExecutor(max_workers=5) as ex:
              d=ex.submit(describe);pts=list(ex.map(point,layers.items()))
          (out/'report.json').write_text(json.dumps({'utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'point_epsg25831':[430465,4582340],'wcs':d.result(),'wms':pts,'qualification':'Point queries; not original GeoTIFF windows. Source dates and vertical datum require explicit metadata.'},ensure_ascii=False,indent=2)+'\n')
      - name: Publish without force
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add custody/f0-lot24-20261125
          git commit -m 'Preserve lot24 numerical query audit'
          for attempt in 1 2 3; do
            git fetch origin audit/f0-lot06-20261125
            git rebase FETCH_HEAD || { git rebase --abort; exit 1; }
            if git push origin HEAD:audit/f0-lot06-20261125; then exit 0; fi
          done
          exit 1

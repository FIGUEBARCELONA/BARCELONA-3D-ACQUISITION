name: F0 lot07 POST and orthophoto diagnostic
on:
  push:
    branches: [audit/f0-lot06-20261125]
    paths: ['.github/workflows/f0-lot07-diagnostics.yml']
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: POST and WMS acquisition
        shell: python
        run: |
          import urllib.request,urllib.parse,json,hashlib,pathlib,datetime,subprocess,base64,io,struct
          out=pathlib.Path('custody/f0-lot07-20261125');out.mkdir(parents=True,exist_ok=True)
          report={'utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'horizons':{},'orthophoto':{}}
          batch="""!$$SOF
          COMMAND='10'
          OBJ_DATA='NO'
          MAKE_EPHEM='YES'
          TABLE_TYPE='OBSERVER'
          CENTER='coord@399'
          COORD_TYPE='GEODETIC'
          SITE_COORD='2.16774,41.38386,0.033'
          START_TIME='2021-01-01 12:00'
          STOP_TIME='2025-12-31 12:00'
          STEP_SIZE='1 d'
          QUANTITIES='4'
          CSV_FORMAT='YES'
          """
          r=report['horizons'];r.update(url='https://ssd.jpl.nasa.gov/api/horizons_file.api',status='BLOCKED',input=batch,qualification='Diagnostic 12 UTC at XEMA X4; altitude datum unconfirmed. Not complete universe.')
          try:
              p=subprocess.run(['curl','--silent','--show-error','--max-time','55','-w','%{http_code}','-o','/tmp/horizons.json','-F','format=json','-F','input=@-;filename=ephemeris.txt;type=text/plain',r['url']],input=batch.encode(),capture_output=True)
              r.update(http=p.stdout.decode(),curl_exit=p.returncode)
              b=pathlib.Path('/tmp/horizons.json').read_bytes()
              r.update(bytes=len(b),sha256=hashlib.sha256(b).hexdigest())
              j=json.loads(b);r['signature']=j.get('signature');t=j.get('result','')
              if j.get('error') or '$$SOE' not in t or '$$EOE' not in t: raise ValueError(str(j.get('error',t[:300])))
              rows=[x.strip() for x in t.split('$$SOE',1)[1].split('$$EOE',1)[0].splitlines() if x.strip()]
              r.update(rows=len(rows),expected=1826,first=rows[0],last=rows[-1],status='INSPECTED' if len(rows)==1826 else 'PARTIAL')
              (out/'horizons.json').write_bytes(b)
          except Exception as e:r['error']=repr(e)
          r=report['orthophoto'];r.update(status='BLOCKED',samples=[],qualification='Three deterministic diagnostic samples only, not positional validation; ICGC CC BY 4.0. No AMB source geometry published in bulk.')
          def get(u):
              with urllib.request.urlopen(urllib.request.Request(u,headers={'User-Agent':'GTA-BCN-F0-audit/1.0'}),timeout=30) as x:return x.read(),x.headers.get('Content-Type')
          try:
              b,ct=get('https://geoportal.amb.cat/geoserveis/rest/services/inventari_platges/MapServer/19/query?where=1%3D1&outFields=objectid&returnGeometry=true&outSR=25831&f=geojson')
              j=json.loads(b);fs=sorted(j['features'],key=lambda f:f['properties']['objectid']);r['source_sha256']=hashlib.sha256(b).hexdigest();r['population']=len(fs)
              for n,i in enumerate([0,len(fs)//2,len(fs)-1],1):
                  f=fs[i];x,y=f['geometry']['coordinates'][:2]
                  s={'sample':n,'objectid':f['properties']['objectid'],'status':'BLOCKED','selection':'sorted OID first/middle/last','layer':'orto-costa-rgb-10cm-202602-202602'}
                  try:
                      p={'SERVICE':'WMS','VERSION':'1.3.0','REQUEST':'GetMap','LAYERS':s['layer'],'STYLES':'','CRS':'EPSG:25831','BBOX':','.join(map(str,[x-15,y-15,x+15,y+15])),'WIDTH':300,'HEIGHT':300,'FORMAT':'image/png','TRANSPARENT':'FALSE'}
                      u='https://geoserveis.icgc.cat/servei/catalunya/orto-costa/wms?'+urllib.parse.urlencode(p)
                      im,ct=get(u);s.update(bytes=len(im),content_type=ct,sha256=hashlib.sha256(im).hexdigest())
                      if im[:8]!=b'\x89PNG\r\n\x1a\n':raise ValueError('Not PNG')
                      w,h=struct.unpack('>II',im[16:24]);s.update(width=w,height=h)
                      if (w,h)!=(300,300):raise ValueError('wrong dimensions')
                      (out/f'ICGC_CC-BY-4.0_sample_{n}.png').write_bytes(im)
                      s.update(status='IMAGE_ACQUIRED',file=f'ICGC_CC-BY-4.0_sample_{n}.png',center_pixel=[150,150],pixel_size_m=0.1,attribution='Institut Cartogràfic i Geològic de Catalunya (ICGC), CC BY 4.0, flight February 2026')
                  except Exception as e:s['error']=repr(e)
                  r['samples'].append(s)
              r['status']='ACQUISITION_ATTEMPTED'
          except Exception as e:r['error']=repr(e)
          (out/'report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n')
      - name: Preserve public audit evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add custody/f0-lot07-20261125
          git commit -m 'Preserve lot07 diagnostic evidence'
          git push origin HEAD:audit/f0-lot06-20261125

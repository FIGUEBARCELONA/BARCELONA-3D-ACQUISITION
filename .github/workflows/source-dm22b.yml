name: DM-22b alternate ATM and public OMD UI
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/source-dm22b.yml']
permissions:
  contents: write
jobs:
  verify:
    if: github.repository == 'FIGUEBARCELONA/BARCELONA-3D-ACQUISITION' && github.event.repository.visibility == 'public'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - run: |
          python3 -m venv .venv
          .venv/bin/pip install --no-cache-dir playwright
          .venv/bin/python source_dm22b.py
      - run: |
          test -f custody/dm22b/report.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- custody/dm22b
          if ! git diff --cached --quiet; then
            git commit -m "DM-22b alternate source diagnostics"
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push origin HEAD:main; then exit 0; fi
            done
            exit 1
          fi

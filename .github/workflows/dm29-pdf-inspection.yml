name: DM29 inspect preserved PDF sources
on:
  push:
    branches: [main]
    paths: ['.github/workflows/dm29-pdf-inspection.yml']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --disable-pip-version-check --quiet pymupdf==1.26.5 opencv-python-headless==4.12.0.88
      - name: Extract QR references and annual tables
        run: |
          python - <<'PY'
          import fitz,cv2,numpy as np,hashlib,pathlib,json,urllib.request,re
          d=pathlib.Path('custody/dm29')
          out={}
          for k in ['parades','horaris','anuari']:
              p=d/(k+'.pdf')
              if not p.exists():out[k]={'status':'MISSING'};continue
              b=p.read_bytes()
              doc=fitz.open(stream=b,filetype='pdf')
              m={'sha256':hashlib.sha256(b).hexdigest(),'bytes':len(b),'pages':len(doc),'status':'INSPECTED'}
              if k=='parades':
                  records=[]
                  for i in range(3):
                      page=doc[i]
                      pix=page.get_pixmap(matrix=fitz.Matrix(3,3),colorspace=fitz.csGRAY,alpha=False)
                      im=np.frombuffer(pix.samples,dtype=np.uint8).reshape(pix.height,pix.width)
                      detector=cv2.QRCodeDetector()
                      ok,vals,points,_=detector.detectAndDecodeMulti(im)
                      hits=[]
                      if ok:
                          hits=sorted([(str(s),float(q[:,1].mean())) for s,q in zip(vals,points) if s],key=lambda x:x[1])
                      if len(hits)!=(2 if i==0 else 3):
                          hits=[]
                          for block in page.get_image_info():
                              rect=fitz.Rect(block['bbox'])
                              if rect.width<20 or rect.height<20 or not .7<rect.width/rect.height<1.3:continue
                              pm=page.get_pixmap(matrix=fitz.Matrix(5,5),clip=rect,colorspace=fitz.csGRAY)
                              a=np.frombuffer(pm.samples,dtype=np.uint8).reshape(pm.height,pm.width)
                              a=cv2.copyMakeBorder(a,30,30,30,30,cv2.BORDER_CONSTANT,value=255)
                              s,_,_=detector.detectAndDecode(a)
                              if s:hits.append((s,rect.y0*3))
                          hits=sorted(hits,key=lambda x:x[1])
                      names=[['73100','73010'],['73009','73008','73007'],['73006','73005','73004']][i]
                      page_record={'page':i+1,'qr_results':hits,'links':page.get_links()}
                      if len(hits)==len(names):
                          page_record['ordered_codes']=[{'code':c,'url':s} for c,(s,y) in zip(names,hits)]
                          for x in page_record['ordered_codes']:
                              try:
                                  if not x['url'].startswith(('https://maps.app.goo.gl/','https://goo.gl/','https://www.google.com/maps','https://maps.google.com/')):continue
                                  req=urllib.request.Request(x['url'],headers={'User-Agent':'Mozilla/5.0'})
                                  with urllib.request.urlopen(req,timeout=10) as f:x['resolved_url']=f.geturl()
                              except Exception as e:x['resolution_error']=repr(e)
                      records.append(page_record)
                  m['qr_pages']=records
              elif k=='anuari':
                  hits=[]
                  for i,page in enumerate(doc):
                      t=page.get_text(sort=True)
                      if 'Barcelona' in t and any(x in t.upper() for x in ['UNIDADES DE TRANSPORTE INTERMODAL','BUQUES MERCANTES','BUQUES ENTRADOS']):
                          hits.append({'page':i+1,'text':t[:20000]})
                  m['candidate_pages']=hits[:20]
              out[k]=m
          (d/'pdf_inspection.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Preserve report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add custody/dm29/pdf_inspection.json
          git commit -m 'DM29 inspect preserved PDF sources'
          git push origin HEAD:main

name: DM-11 native MDT route discovery
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/mdt-route-dm11.yml']
permissions:
  contents: read
jobs:
  probe:
    if: github.repository == 'FIGUEBARCELONA/BARCELONA-3D-ACQUISITION' && github.event.repository.visibility == 'public'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - run: python3 mdt_route_dm11.py

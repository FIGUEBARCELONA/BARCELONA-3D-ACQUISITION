name: DM-18c source readback and targeted recovery
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/independent-dm18c.yml']
permissions:
  contents: write
jobs:
  verify:
    if: github.repository == 'FIGUEBARCELONA/BARCELONA-3D-ACQUISITION' && github.event.repository.visibility == 'public'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - run: python3 independent_dm18c.py
      - name: Preserve evidence
        run: |
          test -f custody/dm18c/report.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- custody/dm18c
          if ! git diff --cached --quiet; then
            git commit -m "DM-18c census and time-base reconciliation evidence"
            git push origin HEAD:main
          fi

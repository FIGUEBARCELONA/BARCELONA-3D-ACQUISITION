name: DM-13 WMS context and transport
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/mdt-wms-context-dm13.yml']
permissions:
  contents: write
jobs:
  verify:
    if: github.repository == 'FIGUEBARCELONA/BARCELONA-3D-ACQUISITION' && github.event.repository.visibility == 'public'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
      - run: |
          python3 -m venv .venv
          .venv/bin/pip install --no-cache-dir requests==2.34.2
          .venv/bin/python mdt_wms_context_dm13.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- custody/dm13/wms-context-report.json
          if ! git diff --cached --quiet; then
            git commit -m "DM-13 bounded WMS observations and HTTP transport report"
            git push origin HEAD:main
          fi

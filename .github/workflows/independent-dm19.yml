name: DM-19 independent source completion
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/independent-dm19.yml']
permissions:
  contents: write
jobs:
  verify:
    if: github.repository == 'FIGUEBARCELONA/BARCELONA-3D-ACQUISITION' && github.event.repository.visibility == 'public'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - run: python3 independent_dm19.py
      - name: Preserve evidence
        run: |
          test -f custody/dm19/report.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- custody/dm19
          if ! git diff --cached --quiet; then
            git commit -m "DM-19 verified source and reversible normalization evidence"
            git push origin HEAD:main
          fi

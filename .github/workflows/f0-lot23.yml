name: F0 lot23 coordinated numerical alternative and safe custody
on:
  push:
    branches: [audit/f0-lot06-20261125]
    paths: ['.github/workflows/f0-lot23.yml']
concurrency:
  group: f0-canonical-custody
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/f0-lot06-20261125
      - name: Acquire bounded WCS numerical sample and municipal datastore metadata
        shell: python
        run: |
          import pathlib,hashlib,json,datetime,urllib.request,urllib.parse,concurrent.futures,math
          out=pathlib.Path('custody/f0-lot23-20261125');out.mkdir(parents=True,exist_ok=True)
          def get(u):
              with urllib.request.urlopen(u,timeout=20) as x:
                  b=x.read(2000001)
                  if len(b)>2000000:raise ValueError('size limit')
                  return b,{'http':x.status,'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest(),'content_type':x.headers.get('Content-Type')}
          def wcs():
              r={'status':'BLOCKED'}
              try:
                  # 15m aligned grid close to previously documented Raval coordinates.
                  x=250007.5+15*round((430420-250007.5)/15);y=4450002.5+15*round((4582300-4450002.5)/15)
                  p={'SERVICE':'WCS','REQUEST':'GetCoverage','VERSION':'1.0.0','CRS':'EPSG:25831','COVERAGE':'icc:met','WIDTH':5,'HEIGHT':5,'FORMAT':'ArcGrid','EXCEPTIONS':'XML','BBOX':f'{x},{y},{x+75},{y+75}'}
                  u='https://geoserveis.icgc.cat/icc_mdt/wcs/service?'+urllib.parse.urlencode(p);r['url']=u
                  b,m=get(u);r.update(m)
                  lines=b.decode('ascii').splitlines();h={}
                  for l in lines[:6]:
                      a=l.split()
                      if len(a)!=2:raise ValueError('unexpected ArcGrid header')
                      h[a[0].lower()]=float(a[1])
                  vals=[float(v) for l in lines[6:] for v in l.split()]
                  if h.get('ncols')!=5 or h.get('nrows')!=5 or h.get('cellsize')!=15 or len(vals)!=25:raise ValueError('unexpected grid')
                  good=[v for v in vals if v!=h.get('nodata_value') and math.isfinite(v)]
                  if not good:raise ValueError('no valid cells')
                  r.update(status='NUMERIC_SAMPLE_INSPECTED',header=h,valid_cells=len(good),min=min(good),max=max(good),values=vals,qualification='WCS legacy terrain sample, not MDTe/MDTev/nDSM/CHM; edition and vertical datum pending')
                  (out/'terrain_wcs.asc').write_bytes(b)
              except Exception as e:r['error']=repr(e)
              return r
          def datastore():
              r={'status':'BLOCKED','resource':'ee11333b-361e-4076-bcba-bf12cf6876e5'}
              try:
                  u='https://opendata-ajuntament.barcelona.cat/data/api/action/datastore_search?'+urllib.parse.urlencode({'resource_id':r['resource'],'limit':0});r['url']=u
                  b,m=get(u);r.update(m);j=json.loads(b)
                  if not j.get('success'):raise ValueError('datastore not available')
                  z=j['result'];r.update(status='METADATA_INSPECTED',total=z.get('total'),fields=z.get('fields'),qualification='No records fetched; metadata only.')
              except Exception as e:r['error']=repr(e)
              return r
          with concurrent.futures.ThreadPoolExecutor(max_workers=2) as ex:
              a=ex.submit(wcs);b=ex.submit(datastore)
              report={'utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'wcs':a.result(),'datastore':b.result()}
          (out/'report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n')
      - name: Publish without force; retry on concurrent non-fast-forward
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add custody/f0-lot23-20261125
          git commit -m 'Preserve coordinated lot23 audit'
          for attempt in 1 2 3; do
            git fetch origin audit/f0-lot06-20261125
            git rebase FETCH_HEAD || { git rebase --abort; exit 1; }
            if git push origin HEAD:audit/f0-lot06-20261125; then exit 0; fi
          done
          exit 1

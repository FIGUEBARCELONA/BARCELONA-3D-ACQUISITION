name: DM-23c direct operator source checks
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/operators-dm23c.yml']
permissions:
  contents: write
jobs:
  verify:
    if: github.repository == 'FIGUEBARCELONA/BARCELONA-3D-ACQUISITION' && github.event.repository.visibility == 'public'
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - run: python3 operators_dm23c.py
      - run: |
          test -f custody/dm23c/report.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- custody/dm23c
          if ! git diff --cached --quiet; then
            git commit -m "DM-23c direct operator diagnostics"
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push origin HEAD:main; then exit 0; fi
            done
            exit 1
          fi

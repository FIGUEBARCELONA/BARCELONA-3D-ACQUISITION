name: DM-22c OMD source schema readback
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/population-dm22c.yml']
permissions:
  contents: write
jobs:
  verify:
    if: github.repository == 'FIGUEBARCELONA/BARCELONA-3D-ACQUISITION' && github.event.repository.visibility == 'public'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
      - run: python3 population_schema_dm22c.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- custody/dm22c/schema.json
          if ! git diff --cached --quiet; then
            git commit -m "DM-22c primary OMD schema evidence"
            git push origin HEAD:main
          fi

name: DM-17 XEMA daily observations
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/xema-dm17.yml']
permissions:
  contents: write
jobs:
  acquire:
    if: github.repository == 'FIGUEBARCELONA/BARCELONA-3D-ACQUISITION' && github.event.repository.visibility == 'public'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - run: python3 xema_dm17.py
      - name: Preserve original public data and diagnostic report
        if: always()
        run: |
          test -f custody/dm17/report.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- custody/dm17
          if ! git diff --cached --quiet; then
            git commit -m "DM-17 XEMA source custody and coverage diagnostics"
            git push origin HEAD:main
          fi

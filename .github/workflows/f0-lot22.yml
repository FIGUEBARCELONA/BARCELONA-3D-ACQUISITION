name: F0 lot22 isolated range transport and run diagnosis
on:
  push:
    branches: [audit/f0-lot06-20261125]
    paths: ['.github/workflows/f0-lot22.yml']
permissions:
  contents: write
  actions: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Diagnose old run and test minimal range without GDAL
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import pathlib,json,datetime,urllib.request,urllib.parse,concurrent.futures,hashlib,os
          out=pathlib.Path('custody/f0-lot22-20261125');out.mkdir(parents=True,exist_ok=True)
          def run_diagnosis():
              r={'status':'BLOCKED'}
              try:
                  u='https://api.github.com/repos/FIGUEBARCELONA/BARCELONA-3D-ACQUISITION/actions/workflows/f0-lot19.yml/runs?head_sha=8f39d6917ad0254469cfe7d546992b432e4c80a8&per_page=5'
                  headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
                  with urllib.request.urlopen(urllib.request.Request(u,headers=headers),timeout=15) as x:j=json.load(x)
                  r['runs']=[]
                  for a in j['workflow_runs']:
                      q={k:a.get(k) for k in ('id','status','conclusion','head_sha','html_url')}
                      with urllib.request.urlopen(urllib.request.Request(a['jobs_url'],headers=headers),timeout=15) as x:jj=json.load(x)
                      q['jobs']=[{k:b.get(k) for k in ('id','name','status','conclusion','steps')} for b in jj['jobs']]
                      r['runs'].append(q)
                  r['status']='INSPECTED'
              except Exception as e:r['error']=repr(e)
              return r
          products={'MDTe':('model-elevacions-terreny-edificis',91974342543),'MDTev':('model-elevacions-terreny-edificis-vegetacio',103567009070),'nDSM':('model-alcaries',98277193439),'CHM':('model-alcaries-vegetacio',84757840889)}
          def header(item):
              k,(n,size)=item;u=f'https://datacloud.icgc.cat/datacloud/{n}/tif_unzip/{n}-lidar-catalunya-1m-2021-2023.tif';r={'product':k,'url':u,'status':'BLOCKED'}
              try:
                  with urllib.request.urlopen(urllib.request.Request(u,headers={'Range':'bytes=0-1023','Accept-Encoding':'identity'}),timeout=12) as x:
                      r.update(http=x.status,content_range=x.headers.get('Content-Range'),etag=x.headers.get('ETag'))
                      if x.status!=206:raise ValueError('range not honored; do not read body')
                      b=x.read(1025)
                  if len(b)!=1024 or r['content_range']!=f'bytes 0-1023/{size}':raise ValueError('range mismatch')
                  if b[:4].hex() not in ('49492a00','4d4d002a','49492b00','4d4d002b'):raise ValueError('not TIFF')
                  r.update(status='HEADER_ONLY_VERIFIED',sha256=hashlib.sha256(b).hexdigest(),signature=b[:16].hex())
              except Exception as e:r['error']=repr(e)
              return r
          with concurrent.futures.ThreadPoolExecutor(max_workers=5) as ex:
              d=ex.submit(run_diagnosis);rs=list(ex.map(header,products.items()))
              report={'utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'old_run':d.result(),'ranges':rs,'qualification':'Header-only transport diagnostic; not original raster values.'}
          (out/'report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n')
      - name: Preserve report only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add custody/f0-lot22-20261125/report.json
          git commit -m 'Preserve isolated COG transport and run diagnosis'
          git push origin HEAD:audit/f0-lot06-20261125

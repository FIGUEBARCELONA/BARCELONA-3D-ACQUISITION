name: DM-22d primary population reconciliation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/population-dm22d.yml']
permissions:
  contents: write
jobs:
  verify:
    if: github.repository == 'FIGUEBARCELONA/BARCELONA-3D-ACQUISITION' && github.event.repository.visibility == 'public'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
      - run: python3 population_dm22d.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- custody/dm22d
          if ! git diff --cached --quiet; then
            git commit -m "DM-22d original municipal population reconciliation"
            git push origin HEAD:main
          fi

name: DM-12 native terrain acquisition
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/mdt-native-dm12.yml']
permissions:
  contents: write
jobs:
  verify:
    if: github.repository == 'FIGUEBARCELONA/BARCELONA-3D-ACQUISITION' && github.event.repository.visibility == 'public'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v5
      - run: |
          python3 -m venv .venv
          .venv/bin/pip install --no-cache-dir numpy==2.5.5 requests==2.34.2 rasterio==1.5.2
          .venv/bin/python mdt_native_dm12.py
      - name: Preserve report and any validated native windows
        if: always()
        run: |
          test -f custody/dm12/report.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- custody/dm12
          if ! git diff --cached --quiet; then
            git commit -m "DM-12 terrain acquisition evidence"
            git push origin HEAD:main
          fi
          cat custody/dm12/report.json >> "$GITHUB_STEP_SUMMARY"

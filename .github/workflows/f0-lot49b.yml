name: F0 lot49b recover complete first GeoPackage member
on:
  push:
    branches: [audit/f0-lot06-20261125]
    paths: ['.github/workflows/f0-lot49b.yml']
concurrency:
  group: f0-canonical-custody
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/f0-lot06-20261125
          fetch-depth: 0
      - name: Recover original member and inspect alternate feeds
        shell: python
        run: |
          import urllib.request,hashlib,struct,zlib,sqlite3,tempfile,pathlib,json,datetime,time,concurrent.futures,xml.etree.ElementTree as ET
          out=pathlib.Path('custody/f0-lot49b-20261125');out.mkdir(parents=True,exist_ok=True)
          old=json.loads(pathlib.Path('custody/f0-lot49-20261125/report.json').read_text())
          def member():
              a=old['zip_member'];r={'source':a['source'],'status':'BLOCKED','member':a['name']}
              try:
                  limit=a['member_end_exclusive']
                  if limit!=50732774 or a['expanded_bytes']!=93929472:raise ValueError('unexpected bounds')
                  t=time.monotonic()
                  req=urllib.request.Request(a['source'],headers={'Accept-Encoding':'identity','User-Agent':'GTA-BCN-public-data-audit/1.0'})
                  with urllib.request.urlopen(req,timeout=35) as x:
                      r['http']=x.status
                      buf=bytearray()
                      while len(buf)<limit:
                          b=x.read(min(1048576,limit-len(buf)))
                          if not b:break
                          buf.extend(b)
                          if time.monotonic()-t>230:raise ValueError('time bound')
                      r['received_bytes']=len(buf)
                  r['seconds']=round(time.monotonic()-t,2)
                  if len(buf)!=limit:raise ValueError('member truncated')
                  if hashlib.sha256(buf[:65536]).hexdigest()!=a['sha256']:raise ValueError('snapshot prefix mismatch')
                  r['prefix_sha256']=a['sha256'];r['acquired_prefix_sha256']=hashlib.sha256(buf).hexdigest()
                  sig,v,flags,method,mt,md,crc,csize,usize,nl,xl=struct.unpack_from('<4s5H3I2H',buf)
                  if sig!=b'PK\x03\x04' or flags!=2048 or method!=8 or csize!=a['compressed_bytes'] or usize!=a['expanded_bytes'] or format(crc,'08x')!=a['crc32']:raise ValueError('header mismatch')
                  offset=30+nl+xl
                  if offset+csize!=limit or buf[30:30+nl].decode('utf-8')!=a['name']:raise ValueError('member identity mismatch')
                  dec=zlib.decompressobj(-15)
                  raw=dec.decompress(memoryview(buf)[offset:],usize+1)
                  if len(raw)!=usize or not dec.eof or dec.unused_data or dec.unconsumed_tail:raise ValueError('DEFLATE termination or size')
                  if zlib.crc32(raw)&0xffffffff!=crc:raise ValueError('CRC mismatch')
                  r.update(member_bytes=len(raw),member_sha256=hashlib.sha256(raw).hexdigest(),crc32=format(crc,'08x'),status='MEMBER_CRC_VERIFIED')
                  (out/'member_checkpoint.json').write_text(json.dumps(r,indent=2)+'\n')
                  with tempfile.TemporaryDirectory() as td:
                      p=pathlib.Path(td)/'source.gpkg';p.write_bytes(raw);del raw,buf
                      with sqlite3.connect(p.as_uri()+'?mode=ro&immutable=1',uri=True) as db:
                          db.execute('PRAGMA query_only=ON')
                          r['application_id']=db.execute('PRAGMA application_id').fetchone()[0]
                          r['quick_check']=db.execute('PRAGMA quick_check').fetchall()
                          r['integrity_check']=db.execute('PRAGMA integrity_check').fetchall()
                          r['foreign_key_violations']=sum(1 for _ in db.execute('PRAGMA foreign_key_check'))
                          r['srs']=db.execute('SELECT srs_id,organization,organization_coordsys_id FROM gpkg_spatial_ref_sys').fetchall()
                          r['geometry_columns']=db.execute('SELECT table_name,column_name,geometry_type_name,srs_id,z,m FROM gpkg_geometry_columns').fetchall()
                          r['layers']=[]
                          for name,typ,ident,last,srs in db.execute('SELECT table_name,data_type,identifier,last_change,srs_id FROM gpkg_contents'):
                              q='"'+name.replace('"','""')+'"'
                              r['layers'].append({'name':name,'type':typ,'identifier':ident,'last_change':last,'srs_id':srs,'count':db.execute('SELECT count(*) FROM '+q).fetchone()[0],'columns':[{'name':c[1],'type':c[2]} for c in db.execute('PRAGMA table_info('+q+')')]})
                          if r['quick_check']!=[('ok',)] or r['integrity_check']!=[('ok',)]:raise ValueError('SQLite integrity failure')
                          r['status']='MEMBER_SQLITE_INSPECTED'
              except Exception as e:r['error']=repr(e)
              return r
          def feed(n):
              u='https://w20.bcn.cat/cartobcn/atom.ashx?file='+str(n)
              r={'product':n,'source':u,'status':'BLOCKED'}
              try:
                  with urllib.request.urlopen(u,timeout=20) as x:
                      b=x.read(2000001);r['http']=x.status
                  if len(b)>2000000:raise ValueError('feed bound')
                  ns={'a':'http://www.w3.org/2005/Atom'}
                  root=ET.fromstring(b)
                  links=[{'updated':e.findtext('a:updated',namespaces=ns),**l.attrib} for e in root.findall('a:entry',ns) for l in e.findall('a:link',ns) if l.get('rel')=='section']
                  r.update(bytes=len(b),sha256=hashlib.sha256(b).hexdigest(),count=len(links),links=links,status='FEED_INSPECTED')
              except Exception as e:r['error']=repr(e)
              return r
          with concurrent.futures.ThreadPoolExecutor(max_workers=3) as ex:
              future=ex.submit(member)
              feeds=list(ex.map(feed,[144,113,118,135]))
              r={'member':future.result(),'feeds':feeds}
          r['utc']=datetime.datetime.now(datetime.timezone.utc).isoformat()
          r['qualification']='Only the complete first member is acquired; no central directory or complete ZIP validation. Temporary original bytes not redistributed. No spatial homologation.'
          (out/'report.json').write_text(json.dumps(r,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps({'member':{k:v for k,v in r['member'].items() if k not in ('layers','geometry_columns')},'feeds':[{k:v for k,v in f.items() if k!='links'} for f in feeds]},ensure_ascii=False))
      - name: Preserve report and intermediate checkpoint
        if: always()
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add custody/f0-lot49b-20261125/
          git diff --cached --quiet && exit 1
          git commit -m 'Preserve lot49b original member and alternative feed audit'
          for attempt in 1 2 3; do
            git fetch origin audit/f0-lot06-20261125
            git rebase FETCH_HEAD || { git rebase --abort; exit 1; }
            if git push origin HEAD:audit/f0-lot06-20261125; then exit 0; fi
          done
          exit 1

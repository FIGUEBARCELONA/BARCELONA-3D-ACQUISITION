name: DM-16 public scientific Binder check
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/binder-dm16.yml']
permissions:
  contents: write
jobs:
  probe:
    if: github.repository == 'FIGUEBARCELONA/BARCELONA-3D-ACQUISITION' && github.event.repository.visibility == 'public'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Single short public research session
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --no-cache-dir requests websocket-client
          .venv/bin/python binder_probe_dm16.py
      - name: Preserve diagnostics only
        if: always()
        run: |
          test -f custody/dm16/binder-report.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- custody/dm16/binder-report.json
          if ! git diff --cached --quiet; then
            git commit -m "DM-16 public scientific network diagnostics"
            git push origin HEAD:main
          fi

name: F0 lot06 official source acquisition
on:
  push:
    branches: [audit/f0-lot06-20261125]
    paths: ['.github/workflows/f0-lot06-20261125.yml']
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --disable-pip-version-check playwright==1.51.0
      - name: Fetch and inspect public sources
        shell: python
        run: |
          import urllib.request, urllib.parse, hashlib, json, csv, io, pathlib, concurrent.futures, datetime, xml.etree.ElementTree as ET
          from playwright.sync_api import sync_playwright
          base='https://ssd.jpl.nasa.gov/api/horizons.api'
          base='https://ssd-api.jpl.nasa.gov/horizons.api'
          p={'format':'json','COMMAND':"'10'",'MAKE_EPHEM':"'YES'",'EPHEM_TYPE':"'OBSERVER'",'CENTER':"'coord@399'",'COORD_TYPE':"'GEODETIC'",'SITE_COORD':"'2.16774,41.38386,0.033'",'START_TIME':"'2021-01-01 12:00'",'STOP_TIME':"'2025-12-31 12:00'",'STEP_SIZE':"'1 d'",'QUANTITIES':"'4'",'CSV_FORMAT':"'YES'",'OBJ_DATA':"'NO'"}
          urls={'census':'https://opendata-ajuntament.barcelona.cat/data/dataset/fe177673-0f83-42e7-b35a-ddea901be8bc/resource/38babeec-5c47-43d3-84e7-b13a4b89004f/download','horizons':base+'?'+urllib.parse.urlencode(p),'wms':'https://geoserveis.icgc.cat/servei/catalunya/orto-costa/wms?SERVICE=WMS&REQUEST=GetCapabilities&VERSION=1.3.0'}
          def fetch(k,u):
              r={'url':u,'status':'BLOCKED'}
              try:
                  with urllib.request.urlopen(urllib.request.Request(u,headers={'User-Agent':'GTA-BCN-F0-audit/1.0'}),timeout=65) as res:
                      b=res.read(40000001); r.update(http=res.status,bytes=len(b),sha256=hashlib.sha256(b).hexdigest(),content_type=res.headers.get('Content-Type'))
                  if len(b)>40000000: raise ValueError('size limit')
                  if k=='census':
                      t=b.decode('utf-8-sig'); d=csv.Sniffer().sniff(t[:32768],delimiters=',;\t'); rows=csv.reader(io.StringIO(t),d); header=next(rows); count=bad=0
                      for row in rows:
                          count+=1;bad+=len(row)!=len(header)
                      if count==0 or len(header)<3 or bad: raise ValueError('CSV shape invalid')
                      r.update(fields=header,rows=count,malformed_rows=bad,declared_bytes_match=len(b)==25097459,status='INSPECTED')
                  elif k=='horizons':
                      j=json.loads(b); t=j.get('result','')
                      if '$$SOE' not in t or '$$EOE' not in t: raise ValueError(j.get('error',t[:300]))
                      rows=[line for line in t.split('$$SOE',1)[1].split('$$EOE',1)[0].splitlines() if line.strip()]
                      r.update(rows=len(rows),first=rows[0],last=rows[-1],expected_daily_rows=1826,qualification='Diagnostic 12 UTC at XEMA X4 published coordinates; height datum equivalence not confirmed; no full spatial or temporal coverage, not direct observation.',status='INSPECTED')
                  else:
                      root=ET.fromstring(b); names=[e.text for e in root.iter() if e.tag.split('}')[-1]=='Name' and e.text and 'orto-costa' in e.text]
                      r.update(layer_names=names,layer_count=len(names),status='INSPECTED')
              except Exception as e: r['error']=repr(e)
              return k,r
          with concurrent.futures.ThreadPoolExecutor(max_workers=3) as ex:
              report=dict(ex.map(lambda item:fetch(*item),urls.items()))
          r={'status':'BLOCKED','requests':[]}
          try:
              with sync_playwright() as pw:
                  browser=pw.chromium.launch(channel='chrome',headless=True)
                  page=browser.new_page()
                  def capture(response):
                      u=urllib.parse.urlsplit(response.url)
                      if not (u.hostname and (u.hostname.endswith('instamaps.cat') or u.hostname.endswith('icgc.cat') or u.hostname.endswith('ide.cat'))): return
                      ct=response.headers.get('content-type','')
                      if response.request.resource_type not in ('xhr','fetch'): return
                      q=urllib.parse.parse_qs(u.query)
                      safe={k:v for k,v in q.items() if k.lower() in ('businessid','id','mapid','layerid','format','service','request')}
                      item={'url':urllib.parse.urlunsplit((u.scheme,u.netloc,u.path,urllib.parse.urlencode(safe,doseq=True),'')),'http':response.status,'type':ct}
                      if 'json' in ct:
                          try:
                              j=response.json();item['top_level_keys']=list(j)[:50] if isinstance(j,dict) else [];item['array_count']=len(j) if isinstance(j,list) else None
                          except Exception: pass
                      r['requests'].append(item)
                  page.on('response',capture)
                  page.goto('https://www.instamaps.cat/visor.html?3D=false&businessid=c9ad61b54360453980cb30327e98d641',wait_until='domcontentloaded',timeout=60000)
                  page.wait_for_timeout(15000)
                  r.update(title=page.title(),status='BROWSER_INSPECTED',qualification='Only public network request metadata; no authenticated data.')
                  browser.close()
          except Exception as e: r['error']=repr(e)
          report['instamaps']=r
          out=pathlib.Path('custody/f0-lot06-20261125/report.json');out.parent.mkdir(parents=True,exist_ok=True)
          out.write_text(json.dumps({'utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'results':report},ensure_ascii=False,indent=2)+'\n')
      - name: Preserve audit report only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add custody/f0-lot06-20261125/report.json
          git commit -m 'Preserve F0 lot06 official source audit'
          git push origin HEAD:audit/f0-lot06-20261125

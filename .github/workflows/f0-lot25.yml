name: F0 lot25 explicit terrain coverages and coordinate diagnosis
on:
  push:
    branches: [audit/f0-lot06-20261125]
    paths: ['.github/workflows/f0-lot25.yml']
concurrency:
  group: f0-canonical-custody
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/f0-lot06-20261125
          fetch-depth: 0
      - name: Concurrent bounded read-only diagnostics
        shell: python
        run: |
          import pathlib,json,datetime,urllib.request,urllib.parse,hashlib,concurrent.futures,xml.etree.ElementTree as ET,re,math
          out=pathlib.Path('custody/f0-lot25-20261125');out.mkdir(parents=True,exist_ok=True)
          wcs='https://geoserveis.icgc.cat/icc_mdt/wcs/service'
          wms='https://geoserveis.icgc.cat/servei/catalunya/elevacions-territorial/wms'
          def get(u,p):
              url=u+'?'+urllib.parse.urlencode(p)
              with urllib.request.urlopen(url,timeout=22) as x:
                  b=x.read(1000001)
                  if len(b)>1000000:raise ValueError('size bound')
                  return b,{'url':url,'http':x.status,'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest()}
          def coverage(c):
              r={'coverage':c,'metadata':{},'sample':{}}
              a=r['metadata']
              try:
                  b,m=get(wcs,{'SERVICE':'WCS','VERSION':'1.0.0','REQUEST':'DescribeCoverage','COVERAGE':c});a.update(m)
                  z=ET.fromstring(b)
                  if 'Exception' in z.tag:raise ValueError('OGC exception')
                  (out/(c.replace(':','_')+'.xml')).write_bytes(b)
                  a.update(status='DESCRIBED',root=z.tag,grid=[{'tag':e.tag.split('}')[-1],'text':e.text,'attributes':e.attrib} for e in z.iter() if e.tag.split('}')[-1] in ('name','label','description','offsetVector','pos','low','high','nativeCRSs','requestResponseCRSs','supportedFormats','format','timePosition','uom')])
              except Exception as e:a.update(status='BLOCKED',error=repr(e))
              a=r['sample']
              try:
                  p={'SERVICE':'WCS','REQUEST':'GetCoverage','VERSION':'1.0.0','CRS':'EPSG:25831','COVERAGE':c,'WIDTH':5,'HEIGHT':5,'FORMAT':'ArcGrid','EXCEPTIONS':'XML','BBOX':'430427.5,4582302.5,430502.5,4582377.5'}
                  b,m=get(wcs,p);a.update(m)
                  lines=b.decode('ascii').splitlines();h={l.split()[0].lower():float(l.split()[1]) for l in lines[:6]}
                  vals=[float(v) for l in lines[6:] for v in l.split()]
                  if h.get('ncols')!=5 or h.get('nrows')!=5 or h.get('cellsize')!=15 or len(vals)!=25:raise ValueError('unexpected grid')
                  valid=[v for v in vals if math.isfinite(v) and v!=h.get('nodata_value')]
                  (out/(c.replace(':','_')+'.asc')).write_bytes(b)
                  a.update(status='NUMERIC_SAMPLE_INSPECTED',header=h,values=vals,valid_cells=len(valid))
              except Exception as e:a.update(status='BLOCKED',error=repr(e))
              return r
          def point(case):
              name,bbox,width,i,j=case;r={'case':name,'status':'BLOCKED'}
              try:
                  l='model-elevacions-terreny-edificis-catalunya-lidar-1m-2021-2023'
                  p={'SERVICE':'WMS','VERSION':'1.3.0','REQUEST':'GetFeatureInfo','LAYERS':l,'QUERY_LAYERS':l,'CRS':'EPSG:25831','BBOX':','.join(map(str,bbox)),'WIDTH':width,'HEIGHT':width,'I':i,'J':j,'STYLES':'','FORMAT':'image/png','INFO_FORMAT':'text/plain','FEATURE_COUNT':1}
                  b,m=get(wms,p);r.update(m)
                  text=b.decode();x,y,v=[float(re.search(k+r" = '([^']+)'",text).group(1)) for k in ('x','y','value_0')]
                  expected=[bbox[0]+(i+.5)*(bbox[2]-bbox[0])/width,bbox[3]-(j+.5)*(bbox[3]-bbox[1])/width]
                  r.update(status='POINT_INSPECTED',requested_center=expected,returned=[x,y],value=v,delta=[x-expected[0],y-expected[1]],distance=math.hypot(x-expected[0],y-expected[1]))
                  (out/(name+'.txt')).write_bytes(b)
              except Exception as e:r['error']=repr(e)
              return r
          cases=[('grid1_center',[430449.5,4582324.5,430480.5,4582355.5],31,15,15),('grid1_east',[430449.5,4582324.5,430480.5,4582355.5],31,20,15),('grid1_north',[430449.5,4582324.5,430480.5,4582355.5],31,15,10),('grid5_center',[430437.5,4582312.5,430492.5,4582367.5],11,5,5)]
          with concurrent.futures.ThreadPoolExecutor(max_workers=6) as ex:
              ca=[ex.submit(coverage,c) for c in ('icc:met5','icc:met15')]
              po=list(ex.map(point,cases))
              report={'utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'coverages':[a.result() for a in ca],'points':po,'qualification':'Diagnostic samples, not positional acceptance or whole raster acquisition.'}
          (out/'report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n')
      - name: Publish without force
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add custody/f0-lot25-20261125
          git commit -m 'Preserve lot25 explicit coverage audit'
          for attempt in 1 2 3; do
            git fetch origin audit/f0-lot06-20261125
            git rebase FETCH_HEAD || { git rebase --abort; exit 1; }
            if git push origin HEAD:audit/f0-lot06-20261125; then exit 0; fi
          done
          exit 1

name: F0 lot17 coordinated source acquisition
on:
  push:
    branches: [audit/f0-lot06-20261125]
    paths: ['.github/workflows/f0-lot17.yml']
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --disable-pip-version-check pymupdf==1.26.5 playwright==1.51.0
      - name: Parallel independent tasks
        shell: python
        run: |
          import pathlib,hashlib,json,datetime,urllib.request,urllib.parse,concurrent.futures,re
          import fitz
          from playwright.sync_api import sync_playwright
          out=pathlib.Path('custody/f0-lot17-20261125');out.mkdir(parents=True,exist_ok=True)
          def get(url,limit=30000000):
              with urllib.request.urlopen(url,timeout=35) as x:
                  b=x.read(limit+1)
                  if len(b)>limit:raise ValueError('limit')
                  return b,{'http':x.status,'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest()}
          def noaa():
              rows=[]
              for name in ('ghcnh-present-weather-elements.pdf','ghcnh-sky-cover-elements.pdf','ghcnh-version-updates.pdf'):
                  r={'name':name,'status':'BLOCKED'}
                  try:
                      b,m=get('https://noaa-ghcnh-pds.s3.us-east-1.amazonaws.com/hourly/doc/'+name);r.update(m)
                      d=fitz.open(stream=b,filetype='pdf')
                      (out/name).write_bytes(b)
                      t='\n\f\n'.join(p.get_text(sort=True) for p in d)
                      (out/(name+'.txt')).write_text(t)
                      r.update(status='PRESERVED_EXTRACTED',pages=len(d),text_file=name+'.txt',code_candidates=[l for l in t.splitlines() if re.search(r'(?<!\d)(400|999)(?!\d)',l)][:30])
                  except Exception as e:r['error']=repr(e)
                  rows.append(r)
              return rows
          def xom():
              prev=json.loads(pathlib.Path('custody/f0-lot15-20261125/report.json').read_text())
              rows=[]
              for f in prev['xom']:
                  if f['kind']!=1:continue
                  r={'year':f['year'],'status':'BLOCKED'}
                  try:
                      b,m=get(f['url']);r.update(m)
                      if m['sha256']!=f['sha256']:raise ValueError('edition changed')
                      d=fitz.open(stream=b,filetype='pdf')
                      hits=[]
                      for i,p in enumerate(d):
                          words=p.get_text('words')
                          matches=[w for w in words if w[4] in ('BN062','BN022','BN007','BN040')]
                          if matches:
                              hits.append({'page':i+1,'rotation':p.rotation,'size':[p.rect.width,p.rect.height],'codes':[w[4] for w in matches],'header':p.get_text()[:350]})
                      r.update(status='STATION_CODE_PAGES_LOCATED',hits=hits)
                  except Exception as e:r['error']=repr(e)
                  rows.append(r)
              return rows
          def icgc():
              r={'status':'BLOCKED','requests':[]}
              try:
                  with sync_playwright() as pw:
                      browser=pw.chromium.launch(channel='chrome',headless=True)
                      page=browser.new_page()
                      def observe(response):
                          u=urllib.parse.urlsplit(response.url)
                          if 'icgc.cat' in (u.hostname or '') and response.request.resource_type in ('xhr','fetch','script'):
                              r['requests'].append({'url':urllib.parse.urlunsplit((u.scheme,u.netloc,u.path,'','')),'status':response.status,'type':response.headers.get('content-type','')})
                      page.on('response',observe)
                      page.goto('https://visors.icgc.cat/appdownloads/',wait_until='domcontentloaded',timeout=45000)
                      page.wait_for_timeout(7000)
                      r['title']=page.title()
                      r['controls']=page.locator('input,select,button').evaluate_all("(els)=>els.map(e=>({tag:e.tagName,id:e.id,name:e.name,value:e.value,label:e.labels?.[0]?.textContent?.trim(),title:e.title})).filter(x=>/elev|alç|veget|mdt|ndsm|chm/i.test(JSON.stringify(x)))")
                      r['status']='VIEWER_INSPECTED'
                      browser.close()
              except Exception as e:r['error']=repr(e)
              return r
          with concurrent.futures.ThreadPoolExecutor(max_workers=3) as ex:
              a=ex.submit(noaa);b=ex.submit(xom);c=ex.submit(icgc)
              report={'utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'noaa':a.result(),'xom':b.result(),'icgc':c.result()}
          (out/'report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n')
      - name: Preserve public domain NOAA documents and reports
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add custody/f0-lot17-20261125
          git commit -m 'Preserve coordinated F0 lot17 source audit'
          git push origin HEAD:audit/f0-lot06-20261125

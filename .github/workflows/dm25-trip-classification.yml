name: DM25 incomplete trip classification
on:
  push:
    branches: [main]
    paths: ['.github/workflows/dm25-trip-classification.yml']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Classify original data
        run: |
          python - <<'PY'
          import csv,io,zipfile,hashlib,json,datetime,collections,pathlib,re,urllib.request
          d=pathlib.Path('custody/dm25');d.mkdir(exist_ok=True)
          def digest(p):return hashlib.sha256(p.read_bytes()).hexdigest()
          def rows(z,n):
              with z.open(n) as f:
                  r=csv.DictReader(io.TextIOWrapper(f,encoding='utf-8-sig',newline=''))
                  for row in r:
                      yield {k.strip():v.strip() for k,v in row.items() if k is not None and v is not None}
          p=pathlib.Path('custody/dm23b/renfe_cercanias.zip')
          a=pathlib.Path('custody/dm19b/ATM_NAP_mdb2832_20261117.zip')
          assert digest(p)=='0609cbf45a41dcc6a328bf82271d80f6675947b5a54168a453d5e98d407b8100'
          assert digest(a)=='af45496d45406ca8d3d123232b9f42f1c8dcf5757aef5c123c56ce8e556396d3'
          targets=['REG_B_'+str(n)+'2026-11-08' for n in range(150401,150552,10) if n not in (150481,150491)]
          targets+=['ABR_02949bb2-f529-40b3-8431-07ebc5951014','ABR_2','ABR_3','SAB_365000100001','SAB_365000100003','SAB_711000100002','TCC_157000010001','TCC_157000010002','TCC_157000020009','TCC_157000020010','TCC_157000020011']
          day='20261124'
          with zipfile.ZipFile(p) as z:
              active={r['service_id'] for r in rows(z,'calendar.txt') if r['start_date']<=day<=r['end_date'] and r['tuesday']=='1'}
              trips={r['trip_id']:r for r in rows(z,'trips.txt') if r['service_id'] in active}
              routes={r['route_id']:r for r in rows(z,'routes.txt')}
              counts=collections.Counter(); single={}
              for r in rows(z,'stop_times.txt'):
                  t=r['trip_id']
                  if t in trips:
                      counts[t]+=1
                      if counts[t]==1:single[t]=r
                      elif counts[t]==2:single.pop(t,None)
              incomplete=[{'trip':v,'route':routes.get(v['route_id']),'stop_rows':counts[k],'sole_stop':single.get(k)} for k,v in trips.items() if counts[k]<2]
              assert len(incomplete)==25
          with zipfile.ZipFile(a) as z:
              at={r['trip_id']:r for r in rows(z,'trips.txt') if r['trip_id'] in targets}
              ar={r['route_id']:r for r in rows(z,'routes.txt') if r['route_id'] in {v['route_id'] for v in at.values()}}
              ac=collections.defaultdict(list)
              for r in rows(z,'stop_times.txt'):
                  if r['trip_id'] in at:ac[r['trip_id']].append(r)
          assert len(at)==25, (len(at),set(targets)-set(at))
          checks=[]
          for t in targets:
              v=at[t]; item={'target':t,'atm_trip':v,'atm_route':ar.get(v['route_id']),'atm_stop_rows':ac[t],'renfe_numeric_candidates':[]}
              if t.startswith('REG_B_'):
                  n=t[6:12]
                  item['renfe_numeric_candidates']=[x for k,x in trips.items() if n in k]
              checks.append(item)
          abr={'status':'NOT_EXECUTED'}
          try:
              url='https://territori.gencat.cat/web/.content/home/serveis/visors-cartografia/bases-cartografiques/infraestructures-mobilitat/autobusos-interurbans/busos-interurbans-GTFS.zip'
              with urllib.request.urlopen(url,timeout=45) as f:
                  b=f.read(50_000_001)
                  meta={'url':url,'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest(),'last_modified':f.headers.get('Last-Modified')}
              assert len(b)<=50_000_000
              with zipfile.ZipFile(io.BytesIO(b)) as z:
                  assert z.testzip() is None
                  agency={r['agency_id']:r for r in rows(z,'agency.txt')}
                  routes2={r['route_id']:r for r in rows(z,'routes.txt') if 'igualadina' in agency.get(r.get('agency_id',''),{}).get('agency_name','').lower()}
                  trips2=[r for r in rows(z,'trips.txt') if r['route_id'] in routes2]
                  cand={t:[r for r in trips2 if r['trip_id'] in (t,t[4:])] for t in targets if t.startswith('ABR_')}
                  abr={**meta,'status':'CHECKS_RECORDED','crc_ok':True,'igualadina_routes':len(routes2),'igualadina_trips':len(trips2),'exact_or_prefix_candidates':cand}
          except Exception as e:abr={'status':'FAILED','error':repr(e)}
          assert digest(p)=='0609cbf45a41dcc6a328bf82271d80f6675947b5a54168a453d5e98d407b8100'
          assert digest(a)=='af45496d45406ca8d3d123232b9f42f1c8dcf5757aef5c123c56ce8e556396d3'
          report={'date':'2026-11-24','renfe_incomplete':incomplete,'renfe_zero_rows':sum(x['stop_rows']==0 for x in incomplete),'renfe_one_row':sum(x['stop_rows']==1 for x in incomplete),'atm_targets':checks,'abr':abr,'identity_recoveries':0,'imputations':0,'originals_unchanged':True,'production':'NO_GO'}
          (d/'report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps({'renfe_zero_rows':report['renfe_zero_rows'],'renfe_one_row':report['renfe_one_row'],'atm_targets':len(checks),'abr':abr},ensure_ascii=False))
          PY
      - name: Preserve report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add custody/dm25/report.json
          git commit -m 'DM25 classify incomplete Renfe and ATM target evidence'
          git push origin HEAD:main

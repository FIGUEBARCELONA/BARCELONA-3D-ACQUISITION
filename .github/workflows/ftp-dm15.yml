name: DM-15 public FTP discovery
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/ftp-dm15.yml']
permissions:
  contents: write
jobs:
  probe:
    if: github.repository == 'FIGUEBARCELONA/BARCELONA-3D-ACQUISITION' && github.event.repository.visibility == 'public'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
      - run: python3 ftp_dm15.py
      - name: Persist bounded diagnostic report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- custody/dm15/ftp-report.json
          if ! git diff --cached --quiet; then
            git commit -m "DM-15 public FTP diagnostics"
            git push origin HEAD:main
          fi

name: DM-20c full temporal and graph audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/independent-dm20c.yml']
permissions:
  contents: write
jobs:
  verify:
    if: github.repository == 'FIGUEBARCELONA/BARCELONA-3D-ACQUISITION' && github.event.repository.visibility == 'public'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - run: python3 independent_dm20c.py
      - name: Preserve diagnostic graph and report
        run: |
          test -f custody/dm20c/report.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- custody/dm20c
          if ! git diff --cached --quiet; then
            git commit -m "DM-20c complete temporal diagnostics"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

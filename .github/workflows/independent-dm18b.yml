name: DM-18b XEMA and Idescat recovery
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/independent-dm18b.yml']
permissions:
  contents: write
jobs:
  acquire:
    if: github.repository == 'FIGUEBARCELONA/BARCELONA-3D-ACQUISITION' && github.event.repository.visibility == 'public'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - run: python3 independent_dm18b.py
      - name: Preserve sources and QA report
        run: |
          test -f custody/dm18b/report.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- custody/dm18b
          if ! git diff --cached --quiet; then
            git commit -m "DM-18b XEMA and Idescat source custody"
            git push origin HEAD:main
          fi
